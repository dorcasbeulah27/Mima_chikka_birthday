const $=id=>document.getElementById(id);const E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function clone(x){return JSON.parse(JSON.stringify(x))}function load(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v||clone(f)}catch(e){return clone(f)}}
function login(){const pw=$("password"),msg=$("loginMsg");if(pw.value!==ADMIN_PASSWORD){msg.textContent="Wrong password ♡";msg.style.color="#b02b4b";return}msg.textContent="";$("login").style.display="none";$("panel").style.display="block";render()}
$("loginButton").addEventListener("click",login);$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
function render(){
 $("adminTitle").textContent=C.adminTitle;$("adminNote").textContent=C.adminNote;
 const keys=[["Logo / header","logo"],["Hero eyebrow","eyebrow"],["Main title","title"],["Intro text","intro"],["Start button","startButton"],["Progress button","progressButton"],["Back button","backButton"],["Answer placeholder","answerPlaceholder"],["Unlock button","unlockButton"],["Hint button","hintButton"],["Wrong answer message","wrongMessage"],["Success heading","successHeading"],["Gift found title (use {n})","giftFoundTitle"],["Next gift button","nextButton"],["Final button","finalButton"],["Progress page title","progressTitle"],["Progress word","progressUnlocked"],["Continue button","continueButton"],["Final title","finalTitle"],["Final text","finalText"],["Footer","footer"],["Admin page title","adminTitle"],["Admin instructions","adminNote"]];
 $("siteEditor").innerHTML=keys.map(([label,key])=>`<label>${label}</label>${["intro","wrongMessage","finalText","adminNote"].includes(key)?`<textarea data-config="${key}">${E(C[key])}</textarea>`:`<input class="cfg" data-config="${key}" value="${E(C[key])}">`}`).join("");
 $("editor").innerHTML=gifts.map((g,i)=>`<div class="giftrow"><strong>Gift #${String(i+1).padStart(2,"0")} ${E(g.emoji)} — ${E(g.gift)}</strong><label>Gift name</label><input class="cfg" data-i="${i}" data-k="gift" value="${E(g.gift)}"><label>Emoji</label><input class="cfg" data-i="${i}" data-k="emoji" value="${E(g.emoji)}"><label>Question / clue</label><textarea data-i="${i}" data-k="question">${E(g.question)}</textarea><label>Correct answer</label><input class="cfg" data-i="${i}" data-k="answer" value="${E(g.answer)}"><label>Hint</label><input class="cfg" data-i="${i}" data-k="hint" value="${E(g.hint)}"><label>Success / reveal message</label><textarea data-i="${i}" data-k="reveal">${E(g.reveal)}</textarea></div>`).join("");
}
function collect(){document.querySelectorAll("[data-config]").forEach(e=>C[e.dataset.config]=e.value);document.querySelectorAll("[data-i]").forEach(e=>gifts[Number(e.dataset.i)][e.dataset.k]=e.value)}
function saveLocal(){collect();localStorage.setItem("v27adminConfig",JSON.stringify(C));localStorage.setItem("v27adminGifts",JSON.stringify(gifts));$("status").textContent="Saved ♡"}
function exportGame(){collect();const html=PUBLIC_TEMPLATE.replace("__GIFTS__",JSON.stringify(gifts)).replace("__CONFIG__",JSON.stringify(C));const blob=new Blob([html],{type:"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$("status").textContent="Final index.html exported ♡"}
$("saveButton").addEventListener("click",saveLocal);$("exportButton").addEventListener("click",exportGame);
</script></body></html>
