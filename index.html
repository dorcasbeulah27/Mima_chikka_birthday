<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Version 27.0</title><style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--wine:#741f36;--wine2:#8d2d49;--ink:#542033}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"DM Sans",sans-serif;color:var(--ink)}
body{background:#64182e url("hearts-bg.jpg") center/cover fixed no-repeat}body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(91,17,39,.24),rgba(91,17,39,.44));pointer-events:none}
button,input,textarea{font:inherit}.wrap{position:relative;z-index:1;max-width:760px;margin:auto;padding:18px 16px 50px}
.nav{display:flex;align-items:center;justify-content:space-between;color:white;margin-bottom:24px}.logo{font-family:Caveat;font-size:25px}.nav button{border:0;background:rgba(255,255,255,.15);color:white;padding:9px 13px;border-radius:999px}
.paper{background:rgba(255,250,247,.97);border-radius:5px;box-shadow:0 16px 45px rgba(36,0,12,.25);position:relative}.paper:before{content:"";position:absolute;inset:10px;border:1px solid rgba(116,31,54,.13);pointer-events:none}
.hero{min-height:78vh;display:flex;align-items:center;justify-content:center;text-align:center}.hero .paper{padding:62px 28px 50px;max-width:610px;transform:rotate(-.5deg)}
.tape{position:absolute;top:-15px;left:50%;transform:translateX(-50%) rotate(-2deg);width:105px;height:30px;background:rgba(230,169,177,.72)}
.eyebrow{letter-spacing:.18em;font-size:11px;color:#9b5265;font-weight:700}.script,.hero h1,.giftname,.q,.hint,.success h2,.admin h2,.num{font-family:Caveat;color:var(--wine)}.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal;color:inherit}
.hero h1{font-size:68px;line-height:.85;margin:12px 0 16px}.hero p{font-size:17px;line-height:1.7;color:#6d4b55}.hearts{font-size:24px;letter-spacing:12px;margin:14px 0}
.primary{border:0;background:var(--wine);color:white;border-radius:999px;padding:14px 26px;font-weight:700;box-shadow:0 8px 20px rgba(116,31,54,.25)}
.game{display:none}.topline{display:flex;align-items:center;justify-content:space-between;color:white;margin-bottom:12px}.back{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);color:white;border-radius:999px;padding:8px 13px}.count{font-weight:700}.bar{height:7px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-bottom:20px}.bar i{display:block;height:100%;background:#ffd2da;width:0;transition:.4s}
.question-bg{background:#fff8f4 url("lips-bg.jpg") center/cover;border-radius:4px;padding:26px;min-height:510px;display:flex;align-items:center;justify-content:center}.question-card{background:rgba(255,250,247,.95);width:min(570px,100%);padding:42px 25px 30px;box-shadow:0 15px 40px rgba(70,0,20,.22);position:relative;text-align:center}.question-card:before{content:"";position:absolute;top:-13px;left:30%;width:100px;height:28px;background:rgba(229,169,177,.75);transform:rotate(-2deg)}
.num{font-size:24px}.giftname{font-size:39px;margin:4px 0 18px}.q{font-size:27px;line-height:1.35;color:#57313e;margin:20px auto;max-width:500px}.answer{width:100%;padding:14px 17px;border:1px solid #e1bfc7;border-radius:999px;background:white;outline:none;text-align:center;color:var(--ink)}.actions{display:flex;gap:9px;justify-content:center;align-items:center;margin-top:13px}.actions .primary{min-width:150px}.hintbtn{border:0;background:transparent;color:var(--wine);font-family:Caveat;font-size:20px}.hint{font-size:19px;margin-top:10px;min-height:25px}.feedback{height:24px;margin-top:7px;font-size:13px;font-weight:700}
.success{background:#fffaf7;padding:44px 24px;text-align:center}.success .big{font-size:64px}.success h2{font-size:48px;margin:8px 0}.success p{font-family:Caveat;font-size:25px;line-height:1.4}.success-image{display:block;width:min(100%,520px);max-height:620px;object-fit:contain;margin:18px auto 4px;border-radius:12px;box-shadow:0 8px 24px rgba(36,0,12,.18)}.next{margin-top:12px}
.progress-paper{padding:28px 20px}.progress-paper h2{font-size:42px;margin:0}.progress-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.progress-text{font-size:13px;color:#87606c}.heart-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:20px 0}.heart{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;font-size:27px;color:#cbb1b7}.heart.done{color:var(--wine)}.heart.current{color:#d15d7c;transform:scale(1.08)}.heart span{position:absolute;font-size:10px;color:#6e4b55;font-weight:700;margin-top:38px}.continue{text-align:center}
.admin{display:none;padding:28px 20px}.admin h2{font-size:40px;margin:0}.admin-note{background:#f9e8eb;padding:12px 14px;margin:14px 0;border-radius:12px;font-size:13px;color:#744255}.giftrow{padding:18px 0;border-top:1px dashed #d8b9c1}.giftrow strong{font-family:Caveat;font-size:25px;color:var(--wine)}label{display:block;font-size:11px;font-weight:700;color:#87606c;margin:10px 0 5px}textarea,input.cfg,.login input{width:100%;border:1px solid #dec4ca;background:white;border-radius:10px;padding:10px;color:var(--ink);outline:none}textarea{min-height:68px;resize:vertical}.admin-actions{position:sticky;bottom:0;background:rgba(255,250,247,.96);padding:12px 0;display:flex;gap:10px}.admin-actions button{flex:1}.login{max-width:430px;margin:13vh auto 0;padding:34px 24px;text-align:center}.login h2{font-family:Caveat;font-size:45px;color:var(--wine);margin:5px}.login p{color:#795560}.login input{border-radius:999px;text-align:center}.footer{text-align:center;color:rgba(255,255,255,.75);font-family:Caveat;font-size:20px;margin-top:16px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}.c{position:absolute;width:8px;height:15px;animation:drop 1.6s linear forwards}@keyframes drop{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@media(max-width:520px){.hero h1{font-size:58px}.hero .paper{padding:50px 20px 38px}.question-bg{padding:18px;min-height:530px}.q{font-size:24px}.giftname{font-size:36px}.heart-grid{gap:7px}}

nd. My cutie pie oda face clean ah irukanum😘"},{"id":19,"gift":"Gift 19","emoji":"🫣","question":"You lift weights there…\nbut I’m hoping you’ll lift me too. 😉❤️\nWhere am I?","answer":"Gym","hint":"Vittutu poriye oru place ku 😑","reveal":"Gift #19 found. 🏋🏻"},{"id":20,"gift":"Gift 20","emoji":"💖","question":"You usually forget me.\nWhat am I?","answer":"Mobile","hint":"Not 🧠","reveal":"Gift #20 found. 👜To carry everything safe.."},{"id":21,"gift":"Gift 21","emoji":"🤤","question":"Sounds like cow dung in Telugu… 🐄😂\nBut thankfully, this one is actually dessert! 😋\nWhat am I?","answer":"Makkan peda","hint":"💩","reveal":"Gift #21 found. 😆 Enjoy it"},{"id":22,"gift":"Gift 22","emoji":"😌","question":"18 + 🔴 + 🏏\nPut them together…\nWho am I?","answer":"Virat Kohli","hint":"🚮","reveal":"KING KOHLI HAS ENTERED THE CHAT. 🏏 Gift #22."},{"id":23,"gift":"Gift 23","emoji":"😭","question":"Idhu cute ah iruku nu vangine paa 🫣\nAnswer: Summa","answer":"Summa","hint":"🐢","reveal":"Gift #23 found. Cute 🐢"},{"id":24,"gift":"Gift 24","emoji":"😶‍🌫️","question":"I’m always with you,\nbut I never get tired of waiting. 😉\nI only have one job…\nto remind you that time is running out. 😂\nWhat am I?","answer":"Watch","hint":"Horsepower, but for your wrist.","reveal":"⌚ Gift #24 unlocked.\nThambi idhu delay aagum vara..so kindly wait "},{"id":25,"gift":"Gift 25","emoji":"🥱","question":"Punishment time for the words you said😤\nAnswer: I'm Sorry","answer":"I'm Sorry","hint":"😡","reveal":"Gift #25 found. I want you to learn knitting as punishment..and give me a creative Chrohest keychain 😌"},{"id":26,"gift":"Gift 26","emoji":"🥵","question":"After a little 😏,\nI go missing…\nThen we start a 2-minute treasure hunt on the your bed. 😂\nWhat am I?","answer":"Specs","hint":"Without me you can't do anything","reveal":"Gift #26 found. 👓 One final level remains."},{"id":27,"gift":"Gift 27","emoji":"🤗","question":"Final surprise\nAnswer: I Dhanush B Dev..I promise Beulah, for better, for worse, for richer, function check(){const g=gifts[level],v=N(document.getElementById("ans").value),t=N(g.answer),ok=v===t||(t==="netflix"&&v.includes("netflix"))||(t==="mustang"&&v.includes("mustang"))||(t==="dessert"&&v.includes("dessert"));if(!ok){document.getElementById("fb").style.color="#b02b4b";document.getElementById("fb").textContent=C.wrongMessage;return}celebrate();document.getElementById("stage").innerHTML=`<div class="paper success"><div class="big">${E(g.emoji)}</div><div class="num">${E(C.successHeading)}</div><h2>${E(C.giftFoundTitle.replace("{n}",level+1))}</h2><p>${E(g.reveal)}</p>${level===13?`<img class="success-image" src="${giftImage14}" alt="Slippers delivery update">`:level===23?`<img class="success-image" src="${giftImage24}" alt="Mustang watch update">`:``}<button class="primary next" onclick="next()">${E(level===26?C.finalButton:C.nextButton)} ➡️</button></div>`}
