const C={"logo":"27 Gifts ♡","eyebrow":"A LITTLE GAME • A LOT OF LOVE","title":"Mumu birthday ","intro":"27 gifts. 27 clues. And one ridiculously lucky birthday boy.","startButton":"START THE GAME","progressButton":"YOUR 27 GIFTS ♡","backButton":"← Home","answerPlaceholder":"Type your answer...","unlockButton":"UNLOCK","hintButton":"hint","wrongMessage":"Not quite... try again ♡","successHeading":"DADAAA!","giftFoundTitle":"Gift #{n} found!","nextButton":"NEXT GIFT","finalButton":"WATCH THE FINALE","progressTitle":"Your 27 Gifts ♡","progressUnlocked":"unlocked","continueButton":"CONTINUE THE ADVENTURE","finalTitle":"Series Finale","finalText":"You've found every gift. Now watch the final episode of Version 27.0 ♡","footer":"small clues • big smiles ♡","adminTitle":"Configure Gifts ♡","adminNote":"Edit every visible text and all 27 gift challenges. Save or export the finished game."};
let gifts=(()=>{try{return JSON.parse(localStorage.getItem("v27gifts"))||giftsData}catch(e){return giftsData}})();
